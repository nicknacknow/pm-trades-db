services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trade_store"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pm-trades-db-internal

  pm-trades-db:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pm-trades-db
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      REDIS_URL: ${REDIS_URL}
      DATABASE_URL: ${DATABASE_URL}
      CHANNEL: ${CHANNEL}
      METRICS_PORT: ${METRICS_PORT}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - pm-trades-db-internal
      - pm-project

volumes:
  postgres_data:

networks:
  pm-trades-db-internal:
  pm-project:
    external: true
    name: pm-project
